<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxNovel Importer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 350px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", sans-serif;
      padding: 16px;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 13px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.1);
      color: #94a3b8;
    }
    .status-badge.online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .novel-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
      line-height: 1.3;
    }
    .chapter-title {
      font-size: 12.5px;
      color: #c084fc;
      margin-bottom: 8px;
    }
    .meta-tags {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .meta-tag {
      background: rgba(51, 65, 85, 0.6);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .btn-primary {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      width: 100%;
      padding: 7px 10px;
      background: rgba(51, 65, 85, 0.6);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.7);
      color: #ffffff;
    }
    .empty-state {
      text-align: center;
      padding: 12px 6px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }
    .empty-icon {
      font-size: 26px;
      margin-bottom: 6px;
    }
    .settings-section {
      margin-top: 12px;
      font-size: 11px;
    }
    .settings-toggle {
      color: #64748b;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 8px;
      display: inline-block;
    }
    .settings-body {
      display: none;
      margin-top: 6px;
      gap: 6px;
    }
    .settings-body.active {
      display: flex;
    }
    .server-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      color: #e2e8f0;
      padding: 4px 8px;
      font-size: 11px;
    }
    .btn-save {
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🎙️</div>
      <span>VoxNovel</span>
    </div>
    <div id="status-badge" class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Checking...</span>
    </div>
  </header>

  <div id="content-container">
    <div class="card" id="novel-card">
      <div class="card-title">Active Chapter</div>
      <div id="card-body">
        <div class="empty-state">
          <div class="empty-icon">📖</div>
          <p>Analyzing current page...</p>
        </div>
      </div>
    </div>

    <button id="import-btn" class="btn-primary" disabled>
      <span>🎙️ Import to VoxNovel</span>
    </button>
  </div>

  <div style="margin-top: 12px;">
    <a href="http://127.0.0.1:8000" target="_blank" class="btn-secondary">
      <span>Open VoxNovel Web UI ↗</span>
    </a>
  </div>

  <div class="settings-section">
    <span id="settings-toggle" class="settings-toggle">Server Settings</span>
    <div id="settings-body" class="settings-body">
      <input type="text" id="server-url-input" class="server-input" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000">
      <button id="save-server-btn" class="btn-save">Save</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
